name: Live SEO monitor

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-seo-monitor
  cancel-in-progress: false

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the deployed SEO surface
        run: npm run verify:live-seo
        env:
          LIVE_SITE_ORIGIN: https://cornellphysicalintelligence.com
