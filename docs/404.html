<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Two shapes on purpose. Google's result pages put the favicon in a circular chip,
         where the tab's rounded square read as a mismatched inset shape — so the search
         crawler gets a disc. It prefers 48px-multiple bitmaps, hence the 192; browsers
         resolve the later, tab-sized declarations instead (Safari the 32px PNG since it
         ignores SVG icons, everything else the SVG). ?v=2 busts the cached disc-shaped
         copy of favicon.svg that tabs held before the shapes were split. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Playfair Display 700 is self-hosted because the hero blocks on it: VoronoiTitle
         rasterises the glyph outline before it can build its sim, so this face sits on the
         critical path. Via Google Fonts that meant two sequential cross-origin round trips
         (stylesheet, then the woff2 URL it reveals) before the hero could start. Preloaded
         from our own origin, the fetch begins during HTML parse instead. Latin subset only,
         23KB. `crossorigin` is required even same-origin — fonts are fetched in CORS mode,
         and without it the preload is discarded and the file fetched twice.
         OFL-licensed; see public/fonts/PlayfairDisplay-OFL.txt. -->
    <link
      rel="preload"
      href="/fonts/playfair-display-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Inline rather than imported so the face is declared before the stylesheet
         request resolves — the preload above is only useful if the @font-face that
         claims it is already parsed. */
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/playfair-display-700-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- Questrial is self-hosted for the same reason Playfair is, and the reasoning above
         applies twice over here: this was a render-blocking <link rel="stylesheet"> to
         fonts.googleapis.com, an origin nothing had preconnected to. First paint waited on
         a DNS lookup, a TCP handshake and a TLS negotiation to reach that stylesheet, and
         only once it arrived did the browser learn the woff2 URL it then had to fetch from
         a second origin. Two cold cross-origin round trips before a single glyph, on every
         page of the site. Served from here, one preload starts during HTML parse. -->
    <link
      rel="preload"
      href="/fonts/questrial-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Inline for the same reason as Playfair: a preload only counts if the @font-face
         claiming it has already been parsed. OFL-licensed; see public/fonts/Questrial-OFL.txt. */
      @font-face {
        font-family: 'Questrial';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/questrial-400-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
